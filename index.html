<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doce Zambas y una Yapa para el recuerdo</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #111;
  font-family: Georgia, serif;
}

.portada {
  position: relative;
  height: 92vh;
  width: auto;
  max-width: 100%;
  margin: 0 auto;
}

.portada img {
  display: block;
  height: 100%;
  width: auto;
  max-width: 100%;
  margin: 0 auto;
}

/* Botón ZAMBAS */

.boton-zambas {
  position: absolute;
  left: 12%;
  bottom: 10%;
  width: 32%;
  height: 12%;
  display: block;
  text-decoration: none;
}

/* Botón LIBRO */

.boton-libro {
  position: absolute;
  right: 12%;
  bottom: 10%;
  width: 32%;
  height: 12%;
  display: block;
  text-decoration: none;
}

/* Efecto al tocar o pasar el mouse */

.boton-zambas:hover,
.boton-libro:hover {
  background: rgba(255,255,255,0.08);
  border-radius: 25px;
}

/* Accesibilidad */

.boton-zambas span,
.boton-libro span {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

</style>

</head>

<body>

<div class="portada">

  <!-- Imagen principal de la portada -->
  <img src="Imagen Audiolibro.png"
       alt="Doce zambas y una Yapa para el recuerdo. Escribidor: Luis Alberto Bilbao la Vieja.">

  <!-- Botón ZAMBAS -->
  <a href="videos.html"
     class="boton-zambas"
     aria-label="Zambas – Para que las escuches">
     <span>ZAMBAS – Para que las escuches</span>
  </a>

  <!-- Botón LIBRO -->
  <a href="textos.html"
     class="boton-libro"
     aria-label="Libro – Para que lo leas">
     <span>LIBRO – Para que lo leas</span>
  </a>

</div>

</body>
</html>
