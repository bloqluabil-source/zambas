<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doce zambas y una Yapa para el recuerdo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #eee5d5;
  font-family: Georgia, serif;
}

/* PORTADA */

.portada {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  overflow: hidden;
}

/* Imagen de la portada */

.portada img {
  display: block;
  width: 100%;
  height: auto;
}

/* BOTÓN ZAMBAS */

.boton-zambas {
  position: absolute;
  left: 15%;
  width: 70%;
  top: 70%;
  height: 11%;
  display: block;
  text-decoration: none;
}

/* BOTÓN LIBRO */

.boton-libro {
  position: absolute;
  left: 15%;
  width: 70%;
  top: 83%;
  height: 11%;
  display: block;
  text-decoration: none;
}

/* Efecto al pasar el mouse o tocar */

.boton-zambas:hover,
.boton-libro:hover {
  background: rgba(255,255,255,0.08);
  border-radius: 25px;
}

/* Texto invisible para accesibilidad */

.boton-zambas span,
.boton-libro span {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

</style>

</head>

<body>

<div class="portada">

  <img src="portada.png"
       alt="Doce zambas y una Yapa para el recuerdo. Escribidor: Luis Alberto Bilbao la Vieja.">

  <a href="videos.html"
     class="boton-zambas"
     aria-label="Zambas – Para que las escuches">
     <span>ZAMBAS – Para que las escuches</span>
  </a>

  <a href="textos.html"
     class="boton-libro"
     aria-label="Libro – Para que lo leas">
     <span>LIBRO – Para que lo leas</span>
  </a>

</div>

</body>
</html>
